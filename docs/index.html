<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Mode | Cybersecurity Repository</title>
    <meta name="description" content="An educational repository documenting potentially dangerous OS commands for defensive research.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header>
        <div class="header-content">
            <h1>Panic_Mode</h1>
            <p>Educational cybersecurity research on destructive OS commands.</p>
            <div class="warning-banner">
                <strong>⚠️ WARNING:</strong> Do not run these commands on production systems. Lab environments only.
            </div>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search commands, descriptions...">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="All">All</button>
                <button class="filter-btn" data-filter="Windows">Windows</button>
                <button class="filter-btn" data-filter="Linux">Linux</button>
                <button class="filter-btn" data-filter="MacOS">macOS</button>
            </div>
        </div>

        <div class="grid" id="commandsGrid">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <footer>
        <p>Created for educational purposes. See <a href="https://github.com/pdev-labs/Panic_Mode/blob/main/DISCLAIMER.md" style="color:var(--accent);">Disclaimer</a>.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
